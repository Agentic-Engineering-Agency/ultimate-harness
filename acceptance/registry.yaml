    freshness_days: 30
    notes: A missing declared output blocks only its worker while a sibling succeeds.
  C1-missing-output-cmdc:
    title: Missing worker output
    capability: C1
    mission: missions/C1-missing-output-cmdc/mission.yaml
    shape: team

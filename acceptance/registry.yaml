      - src/harness/tool-guard.ts
      - src/extensions/tool-guard/**
      - src/adapters/command-code.ts
      - src/harness/runtime-supervision.ts
      - src/harness/runtime-process.ts
    expected:
      status: passed
      stop_code: denial_budget
      resumed: true
      required_records:
        denials: 3
      fact_sources:
        denials: first
        stop_code: last
        resumed: last
    freshness_days: 30
    notes: The runtime hits its denial budget through three real guard denials (outside write, git commit, package install); the guard replaces the oh-my-pi denial wrapper. Inputs cover the tool guard, its command-code hook, the command-code adapter, and the supervision/process layers that enforce the denial budget; src/cli.ts is excluded because the probe asserts guard denials, not CLI parsing.

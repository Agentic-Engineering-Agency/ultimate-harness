    shape: team
    runtime: command-code
    model: qwen/qwen3.8-flash
    inputs:
      - acceptance/missions/S2-cmdc/**
      - acceptance/support/**
      - src/harness/team-run.ts
      - src/harness/runtime-resources.ts
      - src/harness/runtime-accounting.ts
      - src/schema/team.ts
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: succeeded }
    freshness_days: 30
    notes: Command Code port of S2 with identical cost accounting. Inputs cover the wave scheduler, resource limits, and cost accounting that model per-wave reservation; src/cli.ts is excluded because the probe asserts cost accounting, not CLI parsing.
  S3:

        worker-b: { status: succeeded }
        worker-c: { status: succeeded }
    freshness_days: 30
    notes: Command Code port of S1 with identical wave scheduling. Inputs cover the wave scheduler and resource limits that model max_parallel waves; src/cli.ts is excluded because the probe asserts wave scheduling, not CLI parsing.
  S2:
    title: Resource wave accounting
    capability: S2

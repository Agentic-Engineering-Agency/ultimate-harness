    capability: S3
    mission: missions/S3-budget-exhausted/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Remaining team cost budget cannot reserve another worker
    freshness_days: 30
    notes: Two admitted workers consume the budget and the next reservation is blocked.
  S3-budget-exhausted-cmdc:
    title: Exhausted team budget
    capability: S3
    mission: missions/S3-budget-exhausted-cmdc/mission.yaml
    shape: team
    runtime: command-code
    model: qwen/qwen3.8-flash
    inputs:
      - acceptance/missions/S3-budget-exhausted-cmdc/**
      - acceptance/support/**
      - src/harness/team-run.ts
      - src/harness/runtime-resources.ts
      - src/schema/team.ts
    real_mission: not_applicable
    reason: Budget exhaustion needs known completed cost, which this fleet does not report; a command-code wave can only be refused for unknown cost or admitted under unknown_cost=admit, never priced down to an exhausted budget.
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Remaining team cost budget cannot reserve another worker
    freshness_days: 30
    notes: Command Code port of the exhausted team budget admission. Inputs cover the team scheduler and resource limits that refuse admission once the cost budget is exhausted; src/cli.ts is excluded because the probe asserts budget admission, not CLI parsing.
  S3-unknown-cost:
    title: Unknown cost admission
    capability: S3
    mission: missions/S3-unknown-cost/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Completed worker cost is unknown; refusing further paid admission
    freshness_days: 30
    notes: Missing usage cost blocks the next paid wave.
  S3-unknown-cost-cmdc:
    title: Unknown cost admission
    capability: S3
    mission: missions/S3-unknown-cost-cmdc/mission.yaml
    shape: team
    runtime: command-code
    model: qwen/qwen3.8-flash
    inputs:
      - acceptance/missions/S3-unknown-cost-cmdc/**
      - acceptance/support/**
      - src/harness/team-run.ts
      - src/harness/runtime-resources.ts
      - src/harness/runtime-accounting.ts
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Completed worker cost is unknown; refusing further paid admission
    freshness_days: 30
    notes: The command-code costless wrapper strips runtime usage so completed worker cost stays unknown and the next paid wave is refused. Inputs cover the team scheduler, resource limits, and cost accounting that refuse paid admission on unknown cost; src/cli.ts is excluded because the probe asserts unknown-cost admission, not CLI parsing.
  R5-deep-path:
    title: Deep workspace path
    capability: R5

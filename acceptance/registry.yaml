    freshness_days: 30
    notes: Command Code port of the G3 protected-path policy stop. Inputs cover the tool guard, its command-code hook, and the adapter/supervision layers that stop a protected-path write; src/cli.ts is excluded because the probe asserts the policy stop, not CLI parsing.
  R10-stall:
    title: Stall recovery
    capability: R10
    mission: missions/R10-stall/mission.yaml
    shape: single
    runtime: oh-my-pi
    real_mission: not_applicable
    reason: Print-mode runtimes never idle without a tool in flight before the first response, so a real stall has no resumable native session; fixture smoke is the only evidence.
    expected:
      status: passed
      stop_code: stall
      resumed: true
    freshness_days: 30
    notes: Fixture-only mechanism; no real mission evidence is claimed.
  R10-stall-cmdc:
    title: Stall recovery
    capability: R10
    mission: missions/R10-stall-cmdc/mission.yaml
    shape: single
    runtime: command-code
    model: qwen/qwen3.8-flash
    real_mission: not_applicable
    reason: Command Code print mode never idles without a tool in flight before the first response, so a real stall has no resumable native session.
    inputs:
      - acceptance/missions/R10-stall-cmdc/**
      - acceptance/support/**
      - src/harness/runtime-supervision.ts
      - src/harness/runtime-recovery.ts
      - src/harness/runtime-process.ts
    expected:

  G2:
    title: Denial budget
    capability: G2
    mission: missions/G2/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      stop_code: denial_budget
      resumed: true
      required_records:
        denials: 3
      fact_sources:
        denials: first
        stop_code: last
        resumed: last
    notes: The expected failure is evidence that the gate observes real runtime facts.
  G2-cmdc:
    title: Denial budget
    capability: G2
    mission: missions/G2-cmdc/mission.yaml
    shape: single
    runtime: command-code
    model: qwen/qwen3.8-flash
    inputs:

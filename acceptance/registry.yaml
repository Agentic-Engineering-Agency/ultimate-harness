schema_version: uh.acceptance-registry.v0
entries:
  C1:
    title: Per-worker contracts
    capability: C1
    mission: missions/C1/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
      outputs:
        worker-a: passed
        worker-b: passed
    freshness_days: 30
    notes: Two workers have distinct objectives, thinking levels, budgets, and declared outputs.
  C1-cmdc:
    title: Per-worker contracts
    capability: C1
    mission: missions/C1-cmdc/mission.yaml
    shape: team
    runtime: command-code
    model: qwen/qwen3.8-flash
    inputs:
      - acceptance/missions/C1-cmdc/**
      - acceptance/support/**
      - src/harness/team-run.ts
      - src/schema/team.ts
      - src/adapters/command-code.ts
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
      outputs:
        worker-a: passed
        worker-b: passed
    freshness_days: 30
    notes: Command Code port of C1 with identical per-worker contracts. Inputs cover the team scheduler, team schema, and command-code adapter that produce per-worker contracts; src/cli.ts is excluded because the probe asserts worker contract facts, not CLI parsing.
  S1:
    title: Resource wave baseline
    capability: S1

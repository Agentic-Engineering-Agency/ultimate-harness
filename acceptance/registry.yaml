    freshness_days: 30
    notes: Command Code port of the missing declared output contract. Inputs cover the team scheduler and declared-output verification that block only the missing-output worker; src/cli.ts is excluded because the probe asserts worker output contracts, not CLI parsing.
  S3-budget-exhausted:

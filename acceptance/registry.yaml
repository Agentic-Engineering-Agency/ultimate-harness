    shape: single
    runtime: oh-my-pi
    expected:
      status: cancelled
      settlement_confirmed: true
      guardian_receipt: true
    freshness_days: 30
    notes: A freshly launched run is cancelled and settles with a guardian receipt.
  R5-cmdc:
    title: Guardian ownership

      - src/harness/mission-cancel.ts
      - src/harness/runtime-events.ts
      - src/harness/runtime-settlement.ts
      - src/harness/windows-job.ps1
      - src/harness/windows-job.cs
    expected:
      status: cancelled
      settlement_confirmed: true
      guardian_receipt: true
    freshness_days: 30
    notes: Command Code port of R5 with identical guardian settlement. Inputs cover cancellation, runtime events, settlement, and the Windows job guardian that produce the guardian receipt; src/cli.ts is excluded because the probe asserts guardian settlement, not CLI parsing.

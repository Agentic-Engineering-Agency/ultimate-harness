      guardian_receipt: true
    freshness_days: 30
    notes: Command Code port of the deep workspace path settlement. Inputs cover the Windows job guardian, cancellation, and runtime events that settle a deep-path run with a guardian receipt; src/cli.ts is excluded because the probe asserts deep-path settlement, not CLI parsing.
  G1-cmdc-guard:
    title: Command Code guard
    capability: G1
    mission: missions/G1-cmdc-guard/mission.yaml
    shape: single
    runtime: command-code
    model: z-ai/glm-5.3-flash
    inputs:
      - acceptance/missions/G1-cmdc-guard/**
      - acceptance/support/**
      - src/harness/tool-guard.ts
      - src/extensions/tool-guard/**
      - src/adapters/command-code.ts
      - src/harness/runtime-supervision.ts
      - src/harness/runtime-process.ts
    expected:
      status: passed
      required_files: [out/cmdc-guard-report.txt]
      required_records:
        denials: 3
        tool_guard_lines: 3
    freshness_days: 30
    notes: Command Code denies an outside write, git commit, and package install while allowing the report. Run 20260922T040135Z-6c706a failed only because max_turns 12 was exhausted after the registered model spent 48 exploratory tool calls reading the workspace before the three denials; the budget was raised to 40 and the expected facts were not changed. Inputs cover the tool guard, its command-code hook, the command-code adapter, and the supervision/process layers that deny and count the three probes; src/cli.ts is excluded because the probe asserts guard denials, not CLI parsing.
  X1-paths:

    freshness_days: 30
    notes: Command Code port of the canonical forward-slash path probe. Inputs cover artifact path handling, the team scheduler, and the command-code adapter that write canonical forward-slash paths; src/cli.ts is excluded because the probe asserts artifact path style, not CLI parsing.

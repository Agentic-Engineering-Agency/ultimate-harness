schema_version: uh.acceptance-registry.v0
entries:
  C1:
    title: Per-worker contracts
    capability: C1
    mission: missions/C1/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
      outputs:
        worker-a: passed
        worker-b: passed
    freshness_days: 30
    notes: Two workers have distinct objectives, thinking levels, budgets, and declared outputs.
  S1:
    title: Resource wave baseline
    capability: S1
    mission: missions/S1/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: succeeded }
    freshness_days: 30
    notes: Three workers run in waves with max_parallel 2.
  S2:
    title: Resource wave accounting
    capability: S2
    mission: missions/S2/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: succeeded }
    freshness_days: 30
    notes: Cost budget admits all workers.
  S3:
    title: Resource wave settlement
    capability: S3
    mission: missions/S3/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: succeeded }
    freshness_days: 30
    notes: Worker wave facts remain canonical after cleanup.
  G2:
    title: Denial budget
    capability: G2
    mission: missions/G2/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      stop_code: denial_budget
      resumed: true
      required_records:
        denials: 3
      fact_sources:
        denials: first
        stop_code: last
        resumed: last
    notes: The expected failure is evidence that the gate observes real runtime facts.
  R5:
    title: Guardian ownership
    capability: R5
    mission: missions/R5/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: cancelled
      settlement_confirmed: true
      guardian_receipt: true
    freshness_days: 30
    notes: A freshly launched run is cancelled and settles with a guardian receipt.
  policy:
    title: Protected-path policy stop
    capability: G3
    mission: missions/policy/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: failed
      stop_code: policy
      resumed: false
    freshness_days: 30
    notes: A protected-path write must stop the runtime.
  R10-stall:
    title: Stall recovery
    capability: R10
    mission: missions/R10-stall/mission.yaml
    shape: single
    runtime: oh-my-pi
    real_mission: not_applicable
    reason: Print-mode runtimes never idle without a tool in flight before the first response, so a real stall has no resumable native session; fixture smoke is the only evidence.
    expected:
      status: passed
      stop_code: stall
      resumed: true
    freshness_days: 30
    notes: Fixture-only mechanism; no real mission evidence is claimed.
  R10-controller-loss:
    title: Controller loss recovery
    capability: R10
    shape: single
    runtime: oh-my-pi
    mission: missions/R10-controller-loss/mission.yaml
    expected:
      status: passed
      stop_code: controller_lost
      resumed: true
      fact_sources:
        status: last
        stop_code: first
        resumed: last
    freshness_days: 30
    notes: A settled controller-loss attempt is resumed from its recorded run.
  R7-turn-cap:
    title: Turn limit
    capability: R7
    mission: missions/R7-turn-cap/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: failed
      stop_code: turn_limit
      resumed: false
    freshness_days: 30
    notes: A two-turn cap stops a task that requires a third turn.
  R7-repeated-failure:
    title: Repeated-failure stop and recovery
    capability: R7
    mission: missions/R8-repeated-failure/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      stop_code: repeated_failure
      resumed: true
      fact_sources:
        status: last
        stop_code: first
        resumed: last
    freshness_days: 30
    notes: Repeating the same failed command triggers bounded recovery; recovery is the inventory R10 half of this probe.
  C1-missing-output:
    title: Missing worker output
    capability: C1
    mission: missions/C1-missing-output/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: passed_partial
      workers:
        worker-missing:
          status: blocked
          blocked_reason: "Declared output out/missing.txt: Declared output is missing, unreadable, or outside the workspace"
        worker-good: { status: succeeded }
    freshness_days: 30
    notes: A missing declared output blocks only its worker while a sibling succeeds.
  S3-budget-exhausted:
    title: Exhausted team budget
    capability: S3
    mission: missions/S3-budget-exhausted/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Remaining team cost budget cannot reserve another worker
    freshness_days: 30
    notes: Two admitted workers consume the budget and the next reservation is blocked.
  S3-unknown-cost:
    title: Unknown cost admission
    capability: S3
    mission: missions/S3-unknown-cost/mission.yaml
    shape: team
    runtime: oh-my-pi
    expected:
      status: blocked
      workers:
        worker-a: { status: succeeded }
        worker-b: { status: succeeded }
        worker-c: { status: blocked }
      required_records:
        admission_blocked_reason: Completed worker cost is unknown; refusing further paid admission
    freshness_days: 30
    notes: Missing usage cost blocks the next paid wave.
  R5-deep-path:
    title: Deep workspace path
    capability: R5
    mission: missions/R5-deep-path/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      settlement_confirmed: true
      guardian_receipt: true
    freshness_days: 30
    notes: A deep-path run settles with a guardian receipt while the project root remains short.
  G1-cmdc-guard:
    title: Command Code guard
    capability: G1
    mission: missions/G1-cmdc-guard/mission.yaml
    shape: single
    runtime: command-code
    model: z-ai/glm-5.3-flash
    expected:
      status: passed
      required_files: [out/cmdc-guard-report.txt]
      required_records:
        denials: 3
        tool_guard_lines: 3
    freshness_days: 30
    notes: Command Code denies an outside write, git commit, and package install while allowing the report.
  X1-paths:
    title: Forward-slash paths
    capability: X1
    mission: missions/X1-paths/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      path_style: forward_slashes
    freshness_days: 30
    notes: Canonical runtime artifact paths remain portable on Windows.
  R11-deadline-grace:
    title: Deadline grace delivery
    capability: R11
    mission: missions/R11-deadline-grace/mission.yaml
    shape: single
    runtime: oh-my-pi
    expected:
      status: passed
      stop_code: deadline
      resumed: true
      required_files: [out/REPORT.md]
      required_records:
        completion: incomplete
        grace: true
    freshness_days: 30
    notes: A four-turn mission receives one grace attempt that preserves an incomplete report and explicit missing-work handoff.
  G1-cmdc-shell-policy:
    title: Command Code shell protected-path policy
    capability: G1
    mission: missions/G1-cmdc-shell-policy/mission.yaml
    shape: single
    runtime: command-code
    model: z-ai/glm-5.3-flash
    expected:
      status: failed
      stop_code: policy
      resumed: false
      required_records:
        guard_armed: true
    freshness_days: 30
    notes: Guarded Command Code first runs pwd for hook evidence, then attempts rm under .harness; policy must stop before execution.
  G1-cmdc-hook-broken:
    title: Command Code broken guard hook
    capability: G1
    mission: missions/G1-cmdc-hook-broken/mission.yaml
    shape: single
    runtime: command-code
    model: z-ai/glm-5.3-flash
    expected:
      status: failed
      stop_code: policy
      resumed: false
      required_records:
        guard_armed: false
    freshness_days: 30
    notes: The real run prepends acceptance/support/cmdc.cmd via PATH; cmdc-broken-hook.mjs rewrites the generated settings hook to a nonexistent file, exercising G1 fail-closed behavior and G3 protected-artifact tamper detection.

schema_version: uh.mission.v0
id: g1-cmdc-hook-broken-acceptance
title: Command Code missing guard hook evidence
workflow_profile: bugfix-contained
objective: >-
  Run exactly two shell commands in order: first `pwd` once as a harmless guard
  evidence check, then `rm .harness/probe-delete.txt` once. Do not run any other
  command and do not retry. The harness must refuse to continue when the guard
  hook cannot produce its evidence log.
constraints:
  - Do not run git or install packages.
  - Do not bypass or replace the guard.
guard:
  write_roots: [out]
  deny_git_mutations: true
  deny_package_installs: true
  deny_network_clients: true
runtime_config_overrides:
  limits: { max_turns: 12 }
verification:
  required_checks:
    - name: noop
      command: node -e "process.exit(0)"
sandbox:
  backend: git-worktree
  promotion_policy: human-approved

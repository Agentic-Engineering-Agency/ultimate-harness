schema_version: uh.mission.v0
id: r5-acceptance
title: Guardian ownership
workflow_profile: bugfix-contained
objective: Sleep for 60 seconds without changing files, then stop.
constraints:
  - Do not run git.
  - Do not install packages.
  - Keep all files under out/.

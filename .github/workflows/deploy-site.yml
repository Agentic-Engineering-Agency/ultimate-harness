# Build the documentation site (apps/site) on every PR that touches it or the
# Markdown it mirrors, and deploy it to https://uh.agenticeng.app on main.
#
# Deploy prerequisites (repository secrets, reused from deploy-docs.yml):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + Workers Routes:Edit + DNS:Edit
#                          on the agenticeng.app zone.
#   CLOUDFLARE_ACCOUNT_ID  Account that owns the agenticeng.app zone.
name: Docs site

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'specs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-site.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'specs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-deploy:
    # One job: build on every trigger, deploy from the same workspace only on
    # main. No artifact hand-off, so it does not depend on Actions storage.
    name: Build site (deploy on main)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Require deploy credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!secret}" ]; then
              echo "$secret repository secret is required to deploy the docs site." >&2
              exit 1
            fi
          done

      - name: Deploy to uh.agenticeng.app
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx wrangler deploy
